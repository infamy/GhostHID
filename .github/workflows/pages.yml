# Deploys the static site in site/ to GitHub Pages (ghosthid.app).
#
# GitHub Actions ONLY. This file also gets mirrored to Gitea, whose Actions read
# .github/workflows too - the job guard below (github.com host check) makes Gitea
# skip it instead of failing on GitHub-only actions.
#
# The firmware .bin + .minisig are gitignored (too big to commit), so this job
# pulls them from the latest GitHub Release into the site before publishing, so
# the flasher and the in-browser signature check have real files to serve.
name: pages

on:
  push:
    branches: [main]
  release:
    types: [published]     # a new release refreshes the bundled firmware
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ contains(github.server_url, 'github.com') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Set these repo secrets to auto-purge Cloudflare's cache after deploy.
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pages keeps ONE deployment per commit: a second deploy of the same SHA
      # reports success but the first one's files stay live. A release pushes
      # main and its tag together, so the push deploy (bundling the PREVIOUS
      # release) would win over the release deploy of that same commit. When the
      # pushed commit is tagged, leave it to the release event.
      - name: Leave tagged commits to the release deploy
        id: gate
        if: github.event_name == 'push'
        run: |
          if git ls-remote --tags origin | grep -qE "^${GITHUB_SHA}[[:space:]]+refs/tags/v"; then
            echo "commit is tagged - the release event deploys it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle the signed firmware from the latest release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # On a release event, fetch that exact tag: "latest" can still resolve
          # to the previous release for a few seconds after publishing.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          mkdir -p site/flash site/downloads
          TAG="${RELEASE_TAG:-}"
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          # Best-effort: before the first release there's nothing to fetch, and
          # the site must still deploy (the badges fall back to "Signed release"
          # and the flasher simply has no image until a release exists).
          if [ -n "$TAG" ] && gh release download "$TAG" --dir /tmp/rel \
               --pattern 'ghosthid-firmware.bin' \
               --pattern 'ghosthid-firmware.bin.minisig' 2>/dev/null; then
            cp /tmp/rel/ghosthid-firmware.bin         site/downloads/ghosthid-firmware.bin
            cp /tmp/rel/ghosthid-firmware.bin.minisig site/downloads/ghosthid-firmware.bin.minisig
            # The flasher serves the same bytes under its own name; a minisign
            # signature is over the content, so the firmware .minisig verifies
            # ghosthid-s3.bin unchanged.
            cp /tmp/rel/ghosthid-firmware.bin         site/flash/ghosthid-s3.bin
            cp /tmp/rel/ghosthid-firmware.bin.minisig site/flash/ghosthid-s3.bin.minisig
            # The flasher shows the manifest's version; keep it in step with the image.
            # The image path carries a content hash so a new release is a new URL:
            # browsers and Cloudflare otherwise hold the old .bin for hours while the
            # uncached .minisig is new, and the in-browser check fails.
            H="$(sha256sum /tmp/rel/ghosthid-firmware.bin | cut -c1-16)"
            python3 - "${TAG#v}" "$H" <<'EOF'
          import json, sys
          p = "site/flash/manifest.json"
          m = json.load(open(p)); m["version"] = sys.argv[1]
          m["builds"][0]["parts"][0]["path"] = "ghosthid-s3.bin?v=" + sys.argv[2]
          open(p, "w").write(json.dumps(m, indent=2) + "\n")
          EOF
            echo "bundled firmware from $TAG"
          else
            echo "no release yet - deploying the site without a firmware image"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          path: site

      - id: deploy
        if: steps.gate.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        if: ${{ steps.gate.outputs.skip != 'true' && env.CF_ZONE != '' && env.CF_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' >/dev/null \
            && echo "cloudflare cache purged" || echo "cloudflare purge failed (non-fatal)"
