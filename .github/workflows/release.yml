# Creates a Gitea Release when a v* tag is pushed, and attaches the flashable
# image bundle and the browser flasher to it.
#
# Uses plain stdlib Python against the Gitea API with the token the runner
# injects automatically. No third-party action, nothing to configure, and
# nothing that breaks if a JS action runtime is unavailable in the image.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for"
        required: true
        default: "v0.6.1"

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.server_url, 'github.com') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: |
          set -eu
          python3 -m venv /tmp/pio || { apt-get update -qq && \
            apt-get install -y -qq python3-venv zip && python3 -m venv /tmp/pio; }
          /tmp/pio/bin/pip install -q --upgrade pip
          /tmp/pio/bin/pip install -q platformio==6.1.19

      - name: Build and package
        run: |
          set -eu
          # Retry the first configure (pioarduino cold-cache flake).
          for i in 1 2 3; do
            /tmp/pio/bin/pio run -d firmware -e esp32-s3-lcd147 && break
            echo "build attempt $i failed; retrying"; sleep 3
          done
          # Firmware bundle (binaries + checksums + flashing instructions).
          ./scripts/package.sh firmware/.pio/build/esp32-s3-lcd147 esp32-s3-lcd147 dist
          ( cd dist && zip -qr ghosthid-esp32-s3-lcd147.zip ghosthid-esp32-s3-lcd147 )
          # Browser flasher bundle (page + manifest + merged image) - serve the
          # folder over HTTPS, or just download it from the release.
          cp firmware/.pio/build/esp32-s3-lcd147/ghosthid-merged.bin webflasher/ghosthid-s3.bin
          zip -qr dist/ghosthid-webflasher.zip webflasher
          # Also publish the raw merged image directly, so OTA users can verify and
          # flash a single .bin without unzipping a bundle.
          cp firmware/.pio/build/esp32-s3-lcd147/ghosthid-merged.bin dist/ghosthid-firmware.bin
          ls -l dist/

      - name: Sign artifacts (minisign)
        # Provenance for whoever wants it - the device enforces nothing (BYO board).
        # Skips cleanly until MINISIGN_KEY is set, so releases still publish unsigned
        # in the meantime. The one-line public key is in the README for verification.
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "MINISIGN_KEY not set - skipping signing (release will be unsigned)"
            exit 0
          fi
          command -v minisign >/dev/null 2>&1 || { apt-get update -qq && \
            apt-get install -y -qq minisign; }
          TAG="${INPUT_TAG:-}"; [ -n "$TAG" ] || TAG="${GITHUB_REF##*/}"
          printf '%s' "$MINISIGN_KEY" > /tmp/ghosthid.key
          for f in dist/*.zip dist/*.bin; do
            minisign -S -s /tmp/ghosthid.key -t "GhostHID $TAG" -m "$f"   # -> $f.minisig
          done
          rm -f /tmp/ghosthid.key
          ls -l dist/

      - name: Publish the release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          # Pass the dispatch input through the environment, never interpolated
          # into the shell, so a crafted tag can't inject commands (L7).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF##*/}"
          python3 scripts/changelog_section.py "$TAG" > /tmp/notes.md
          # Upload zips + the raw bin, plus any .minisig signatures if signing ran.
          FILES="dist/ghosthid-esp32-s3-lcd147.zip dist/ghosthid-webflasher.zip dist/ghosthid-firmware.bin"
          for sig in dist/*.minisig; do [ -e "$sig" ] && FILES="$FILES $sig"; done
          python3 scripts/gitea_release.py \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}" \
            "$TAG" /tmp/notes.md $FILES

      - name: Mirror the release to GitHub
        # Pushes the tag to GitHub and creates the matching GitHub Release with the
        # same signed assets, so cutting a tag in Gitea publishes to GitHub too.
        # Skips cleanly until GH_PAT (a GitHub PAT with `repo` scope) is set. The
        # created release fires GitHub's release:published, which redeploys Pages.
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: infamy/GhostHID
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -z "${GH_PAT:-}" ]; then
            echo "GH_PAT not set - skipping GitHub mirror"
            exit 0
          fi
          TAG="${INPUT_TAG:-}"; [ -n "$TAG" ] || TAG="${GITHUB_REF##*/}"
          # Push the tag (and its commit objects) so the release can attach to it.
          git push "https://x-access-token:${GH_PAT}@github.com/${GH_REPO}.git" \
            "refs/tags/${TAG}"
          [ -f /tmp/notes.md ] || python3 scripts/changelog_section.py "$TAG" > /tmp/notes.md
          FILES="dist/ghosthid-esp32-s3-lcd147.zip dist/ghosthid-webflasher.zip dist/ghosthid-firmware.bin"
          for sig in dist/*.minisig; do [ -e "$sig" ] && FILES="$FILES $sig"; done
          GH_TOKEN="$GH_PAT" GH_REPO="$GH_REPO" \
            python3 scripts/github_publish.py "$TAG" /tmp/notes.md $FILES
