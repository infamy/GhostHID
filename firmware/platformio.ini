; GhostHID firmware
;
; Built inside Docker for reproducibility - see the Makefile at the repo root.
;   make build     compile in a clean container
;   make flash     flash the artifacts from the host (macOS cannot pass a
;                  serial port into a Linux container)

[platformio]
default_envs = esp32-s3-lcd147
; Generated by the Makefile from WIFI_SSID / AP_PASS / TOKEN etc. Passing -D
; flags with string values through make -> shell -> env var mangles the quotes;
; an ini file is the one place where -DNAME=\"value\" survives intact.
extra_configs = ghosthid_local.ini

; Overridden by ghosthid_local.ini. Empty by default.
[local]
build_flags =

; ---------------------------------------------------------------------------
; Shared settings for every native-USB ESP32 target
; ---------------------------------------------------------------------------
[common]
platform  = espressif32@6.9.0
framework = arduino

build_flags =
    -std=gnu++17
    -Wall
    ; Route Serial over native USB CDC so we keep a debug console on the same
    ; cable that presents the HID interfaces.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB identity MUST be set at build time. With CDC_ON_BOOT=1 the USB stack
    ; is started before setup() runs, so runtime USB.VID()/productName() calls
    ; arrive too late and are silently ignored -- the device would enumerate as
    ; "Espressif ESP32-S2-Saola-1". These override the #ifndef-guarded
    ; defaults in the core's USB.cpp.
    ; Enumerate as a generic USB keyboard, not an Espressif dev board, so EDR /
    ; BadUSB defences don't flag an unknown 0x303A HID on insert. 0x1A2C is the
    ; controller-vendor VID on countless no-name keyboards; the OS binds its
    ; built-in HID class driver, and there's no companion software to react to
    ; it. NOTE: this ID isn't ours - fine for a legitimate device blending in on
    ; your own machines, but don't impersonate a specific branded product (whose
    ; driver could bind to it). Overridable per build via ghosthid_local.ini.
    -DUSB_VID=0x1A2C
    -DUSB_PID=0x0042
    '-DUSB_MANUFACTURER="USB"'
    '-DUSB_PRODUCT="USB Keyboard"'
    ; AsyncTCP's task stack is a single contiguous heap allocation that is
    ; never freed - AsyncTCP 3.5.0 leaves _stop_async_task() commented out,
    ; which is why AsyncWebServer::end() returns no memory at all. So its size
    ; is permanently subtracted from the largest block a TLS handshake can get.
    ; Measured high-water use is about 2.4KB; upstream calls the 16384 default
    ; "way too much waste" and suggests 4-8k.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ${local.build_flags}

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0

extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/merge_firmware.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; ESP32-S3-LCD-1.47 (Waveshare) - dual-core, native USB-C for HID
; The dual core is the point: the Deskflow/HID task is pinned to the APP core
; so Wi-Fi + TLS on the PRO core can never starve it (the single-core
; starvation that made the S2 drop the screen session under load).
; ---------------------------------------------------------------------------
[env:esp32-s3-lcd147]
extends   = common
; pioarduino (arduino-esp32 3.x) - the stock espressif32 bootloader bootloops on
; this board's S3 chip revision; pioarduino boots it (proven by NeonPlugGO).
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 module: 16MB QIO flash + 8MB OPI (octal) PSRAM. The generic board
; default assumes QSPI PSRAM and bootloops on this module - qio_opi matches it.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
; The board definition hard-sets -DARDUINO_USB_MODE=1 (hardware USB-Serial-JTAG,
; which enumerates as an "Espressif JTAG unit" and CANNOT present HID). A plain
; -DARDUINO_USB_MODE=0 does not win against it, so strip the board's flag here
; and set OTG/TinyUSB mode below. Without this the S3 never appears as a keyboard.
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    ; USB-OTG / TinyUSB mode - required for HID.
    -DARDUINO_USB_MODE=0
    ; Sealed mode needs to enumerate with NO USB CDC when locked down. CDC_ON_BOOT
    ; starts CDC before setup(), too early to gate on the NVS flag, so turn it off
    ; and bring CDC up ourselves (only when unsealed) via usb_serial.h, which the
    ; -include below force-includes into every unit to remap `Serial` -> UsbSerial.
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Absolute path: build_flags apply to every unit (core + libs) compiled from
    ; other directories, so a relative -include would be fragile.
    -include ${PROJECT_SRC_DIR}/usb_serial.h
    -DGHOSTHID_VERSION=\"0.8.2-s3\"
    ; RGB LED is a WS2812 (addressable), not a plain GPIO LED - disable for now.
    -DGHOSTHID_PIN_LED=-1
    -DGHOSTHID_PIN_BUTTON=0
    ; On-device status LCD (ST7789 172x320). Pins per the Waveshare wiring.
    -DGHOSTHID_HAS_LCD=1
    -DGHOSTHID_LCD_SCLK=40
    -DGHOSTHID_LCD_MOSI=45
    -DGHOSTHID_LCD_CS=42
    -DGHOSTHID_LCD_DC=41
    -DGHOSTHID_LCD_RST=39
    -DGHOSTHID_LCD_BL=48
    -DGHOSTHID_PIN_RGB=38
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit NeoPixel@^1.12.3

; Debug variant: HWCDC console over the USB-Serial-JTAG so the boot log is
; readable even when USB-OTG/HID isn't coming up. NO HID - diagnosis only.
[env:esp32-s3-dbg]
extends   = common
; The stock espressif32@6.9.0 bootloader bootloops on this board's S3 chip
; revision. pioarduino (arduino-esp32 3.x) is the fork that boots it - proven by
; the NeonPlugGO project on this exact board.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 module: 16MB QIO flash + 8MB OPI (octal) PSRAM. The generic board
; default assumes QSPI PSRAM and bootloops on this module - qio_opi matches it.
board_build.arduino.memory_type = dio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DGHOSTHID_VERSION=\"0.5.0-s3dbg\"
    -DGHOSTHID_PIN_LED=-1
    -DGHOSTHID_PIN_BUTTON=0

; ---------------------------------------------------------------------------
; Host unit tests (no board) - `pio test -e native` / `make test`
; Compiles the pure logic (CommandProcessor, Keymap, Config) against a shim
; layer + a recording HID stub. Never built into device firmware.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = true
build_src_filter =
    +<protocol/CommandProcessor.cpp>
    +<protocol/Keymap.cpp>
    +<config/Config.cpp>
    +<net/DeskflowDispatch.cpp>
    +<crypto/Hmac.cpp>
build_flags =
    -std=gnu++17
    -DGHOSTHID_NATIVE_TEST
    -Isrc
    -Iinclude
    -Itest/test_native/shims
    -Itest/test_native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.0
