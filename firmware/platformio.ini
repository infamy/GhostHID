; GhostHID firmware
;
; Built inside Docker for reproducibility - see the Makefile at the repo root.
;   make build     compile in a clean container
;   make flash     flash the artifacts from the host (macOS cannot pass a
;                  serial port into a Linux container)

[platformio]
default_envs = esp32-s2-key
; Generated by the Makefile from WIFI_SSID / AP_PASS / TOKEN etc. Passing -D
; flags with string values through make -> shell -> env var mangles the quotes;
; an ini file is the one place where -DNAME=\"value\" survives intact.
extra_configs = ghosthid_local.ini

; Overridden by ghosthid_local.ini. Empty by default.
[local]
build_flags =

; ---------------------------------------------------------------------------
; Shared settings for every native-USB ESP32 target
; ---------------------------------------------------------------------------
[common]
platform  = espressif32@6.9.0
framework = arduino

build_flags =
    -std=gnu++17
    -Wall
    ; Route Serial over native USB CDC so we keep a debug console on the same
    ; cable that presents the HID interfaces.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB identity MUST be set at build time. With CDC_ON_BOOT=1 the USB stack
    ; is started before setup() runs, so runtime USB.VID()/productName() calls
    ; arrive too late and are silently ignored -- the device would enumerate as
    ; "Espressif ESP32-S2-Saola-1". These override the #ifndef-guarded
    ; defaults in the core's USB.cpp.
    -DUSB_VID=0x303A
    -DUSB_PID=0x4004
    '-DUSB_MANUFACTURER="GhostHID"'
    '-DUSB_PRODUCT="GhostHID Keyboard/Mouse"'
    ; AsyncTCP's task stack is a single contiguous heap allocation that is
    ; never freed - AsyncTCP 3.5.0 leaves _stop_async_task() commented out,
    ; which is why AsyncWebServer::end() returns no memory at all. So its size
    ; is permanently subtracted from the largest block a TLS handshake can get.
    ; Measured high-water use is about 2.4KB; upstream calls the 16384 default
    ; "way too much waste" and suggests 4-8k.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ${local.build_flags}
    ; Set to 0 to build a device that enumerates but never types on its own.
    -DGHOSTHID_AUTORUN_SELFTEST=1

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0

extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/merge_firmware.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; ESP32-S2 Key V1 - the primary target
; ---------------------------------------------------------------------------
[env:esp32-s2-key]
extends   = common
board     = esp32-s2-saola-1     ; generic ESP32-S2, 4MB flash; see docs/hardware.md
build_flags =
    ${common.build_flags}
    -DGHOSTHID_PIN_LED=15
    -DGHOSTHID_PIN_BUTTON=0
