# Creates a Gitea Release when a v* tag is pushed, and attaches the flashable
# image bundle and the browser flasher to it.
#
# Uses plain stdlib Python against the Gitea API with the token the runner
# injects automatically. No third-party action, nothing to configure, and
# nothing that breaks if a JS action runtime is unavailable in the image.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for"
        required: true
        default: "v0.6.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: |
          set -eu
          python3 -m venv /tmp/pio || { apt-get update -qq && \
            apt-get install -y -qq python3-venv zip && python3 -m venv /tmp/pio; }
          /tmp/pio/bin/pip install -q --upgrade pip
          /tmp/pio/bin/pip install -q platformio==6.1.19

      - name: Build and package
        run: |
          set -eu
          # Retry the first configure (pioarduino cold-cache flake).
          for i in 1 2 3; do
            /tmp/pio/bin/pio run -d firmware -e esp32-s3-lcd147 && break
            echo "build attempt $i failed; retrying"; sleep 3
          done
          # Firmware bundle (binaries + checksums + flashing instructions).
          ./scripts/package.sh firmware/.pio/build/esp32-s3-lcd147 esp32-s3-lcd147 dist
          ( cd dist && zip -qr ghosthid-esp32-s3-lcd147.zip ghosthid-esp32-s3-lcd147 )
          # Browser flasher bundle (page + manifest + merged image) - serve the
          # folder over HTTPS, or just download it from the release.
          cp firmware/.pio/build/esp32-s3-lcd147/ghosthid-merged.bin webflasher/ghosthid-s3.bin
          zip -qr dist/ghosthid-webflasher.zip webflasher
          ls -l dist/

      - name: Publish the release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          # Pass the dispatch input through the environment, never interpolated
          # into the shell, so a crafted tag can't inject commands (L7).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF##*/}"
          python3 scripts/changelog_section.py "$TAG" > /tmp/notes.md
          python3 scripts/gitea_release.py \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}" \
            "$TAG" /tmp/notes.md dist/*.zip
