[project]
name = "ghosthid"
version = "0.3.0"
description = "Controller client for GhostHID, a wireless USB HID bridge"
requires-python = ">=3.9"
dependencies = ["websockets>=13.0"]

[project.scripts]
ghosthid = "ghosthid.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghosthid"]
